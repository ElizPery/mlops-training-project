# 1. Full Access in Staging
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mlops-engineer-full-access
  namespace: staging
rules:
- apiGroups: ["*"]
  resources: ["*"]
  verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bind-mlops-engineer-staging
  namespace: staging
subjects:
- kind: Group
  name: mlops-engineers
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: mlops-engineer-full-access
  apiGroup: rbac.authorization.k8s.io
---
# 2. Limited Access in Production (Read + Exec/Restart)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mlops-engineer-restricted
  namespace: production
rules:
# Access to view most resources
- apiGroups: ["", "apps", "batch", "monitoring.coreos.com"]
  resources: ["pods", "pods/log", "deployments", "services", "servicemonitors", "configmaps", "events"]
  verbs: ["get", "list", "watch"]
# Permission to perform operational restarts of deployments (kubectl rollout restart)
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["patch", "update"]
# Permission to execute commands in pods for debugging
- apiGroups: [""]
  resources: ["pods/exec"]
  verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bind-mlops-engineer-production
  namespace: production
subjects:
- kind: Group
  name: mlops-engineers
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: mlops-engineer-restricted
  apiGroup: rbac.authorization.k8s.io