---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: inference-service-staging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ElizPery/mlops-training-project.git
    targetRevision: HEAD
    path: k8s/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions: [CreateNamespace=true]
