---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: inference-service-production
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ElizPery/mlops-training-project.git
    targetRevision: HEAD
    path: k8s/production
  destination:
    server: https://kubernetes.default.svc
    namespace: production
  syncPolicy:
    automated:
      prune: false
      selfHeal: false
    syncOptions: [CreateNamespace=true]
