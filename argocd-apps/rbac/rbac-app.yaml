apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rbac-config
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/ElizPery/mlops-training-project.git'
    targetRevision: HEAD
    path: rbac
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true