---
apiVersion: v1
kind: Service
metadata:
  name: inference-service
  namespace: production
  labels:
    app: inference-service
spec:
  type: ClusterIP
  selector:
    app: inference-service
    version: blue  # <-- Change to "green" to execute Blue-Green switch
  ports:
    - name: http
      port: 8000
      targetPort: 8000
