name: CI Pipeline - Quality & Testing Gates

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  linters:
    name: Linters & Static Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Linting Tools
        run: |
          pip install ruff black yamllint pytest

      - name: Install Terraform CLI
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      # Check Python Code Formatting
      - name: Check Code Formatting (Black)
        run: black --check src/ tests/

      # Python Linter Check
      - name: Lint Codebase (Ruff)
        run: ruff check src/ tests/

      # Kubernetes Manifest Linting
      - name: Lint Kubernetes Manifests (yamllint)
        run: yamllint -c .yamllint.yml k8s/ argocd-apps/ || yamllint k8s/ argocd-apps/

      # Terraform Formatting Check
      - name: Check Terraform Formatting
        run: terraform fmt -check -recursive terraform/ || echo "No terraform directory found, skipping."

  tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: linters

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Application Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          pip install -r src/inference/requirements.txt
          pip install -r src/training/requirements.txt

      # Unit Test Execution (Preprocessing)
      - name: Run Preprocessing Unit Tests
        env:
          PYTHONPATH: .
        run: pytest tests/unit/test_preprocessing.py -v

      # Integration Test Execution (Full Training Run)
      - name: Run Training Pipeline Integration Test
        env:
          PYTHONPATH: .
        run: pytest tests/integration/test_training_pipeline.py -v -m "integration"